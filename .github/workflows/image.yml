name: Image

# Builds ./Containerfile, tests it, and publishes ghcr.io/<owner>/wrapvm, which
# the Smolfile boots. Rebuilt weekly and on demand for Arch and tool updates.
# The base toolchain is built here, not pulled from another project.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # BuildKit: the Containerfile writes its scripts with RUN heredocs, which
      # Docker's legacy builder turns into empty files.
      - uses: docker/setup-buildx-action@v3

      - name: Check standalone source
        run: make check

      - name: Build base toolchain
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          target: base
          load: true
          pull: true
          tags: localhost/wrapvm:base-test
          cache-from: type=gha,scope=wrapvm
          cache-to: type=gha,mode=max,scope=wrapvm

      - name: Test base toolchain
        run: docker run --rm -v "$PWD/tests:/tests:ro" localhost/wrapvm:base-test bash /tests/container_mise.sh base

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          load: true
          pull: true
          tags: localhost/wrapvm:test
          cache-from: type=gha,scope=wrapvm
          cache-to: type=gha,mode=max,scope=wrapvm

      # The same desktop checks as `make test`.
      - name: Test mise and agent-browser
        run: docker run --rm -v "$PWD/tests:/tests:ro" localhost/wrapvm:test bash /tests/container_mise.sh desktop

      - name: Test the viewer, offline
        run: docker run --rm --network none -e MISE_OFFLINE=1 -v "$PWD/tests:/tests:ro" localhost/wrapvm:test bash /tests/container_viewer.sh

      - name: Test both agent CLIs on a fresh HOME, offline
        run: docker run --rm --network none localhost/wrapvm:test sh -lc 'd=$(mktemp -d); HOME=$d agent-browser --version >/dev/null && HOME=$d agent-desktop version >/dev/null'

      - name: Test accessibility (agent-desktop)
        run: CONTAINER_ENGINE=docker bash tests/container_a11y_run.sh localhost/wrapvm:test

      - name: Test a plain detached run (CDP, viewer, SIGTERM)
        run: CONTAINER_ENGINE=docker bash tests/container_desktop_run.sh localhost/wrapvm:test

      - name: Test desktop integration (ffmpeg, agent-browser config, skills)
        run: docker run --rm -v "$PWD/tests:/tests:ro" localhost/wrapvm:test bash -l /tests/container_wrapvm.sh

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=desktop,enable={{is_default_branch}}
            type=sha,format=long
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      # The same build again, from the cache the first one filled.
      - name: Publish
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=wrapvm
