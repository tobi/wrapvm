name: Image

# Builds ./Containerfile, tests it, and publishes ghcr.io/<owner>/wrapvm, which
# the Smolfile boots. Rebuilt weekly and on demand so a new wrap base image
# (ghcr.io/tobi/wrap:latest) reaches the VM without a commit here; tobi/wrap can
# also send a repository_dispatch of type `base-image` after it publishes.
#
# amd64 is built and published. arm64 is built and tested on a native arm64
# runner but not published: ghcr.io/tobi/wrap publishes no arm64 base, so this
# job builds one from tobi/wrap's Containerfile.arm64 first, and the published
# manifest would need a merge job of its own.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:
  repository_dispatch:
    types: [base-image]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # BuildKit: the Containerfile writes its scripts with RUN heredocs, which
      # Docker's legacy builder turns into empty files.
      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          load: true
          pull: true
          tags: localhost/wrapvm:test
          cache-from: type=gha,scope=wrapvm
          cache-to: type=gha,mode=max,scope=wrapvm

      # The same checks as `make test`: wrap's desktop tests, then wrapvm's own.
      - uses: ./.github/actions/test-image

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=desktop,enable={{is_default_branch}}
            type=sha,format=long
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      # The same build again, from the cache the first one filled.
      - name: Publish
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=wrapvm

  # arm64. The image's Chrome is an amd64-only .deb and dies under qemu-user
  # emulation, so this runs natively on an arm64 runner (free for public
  # repositories) instead of building amd64 under QEMU.
  image-arm64:
    runs-on: ubuntu-24.04-arm
    env:
      # ghcr.io/tobi/wrap publishes no arm64 base, so it is built here from
      # tobi/wrap's Containerfile.arm64. Pinned, like WRAP's own desktop
      # Containerfile is: a moving main must not change what this job tests.
      WRAP_REPO: https://github.com/tobi/wrap
      WRAP_COMMIT: c562a7d2d2dd96600641ffad4c52297ab3bb345a
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the wrap arm64 base
        run: |
          git clone --filter=blob:none "$WRAP_REPO" /tmp/wrap
          git -C /tmp/wrap checkout "$WRAP_COMMIT"
          docker buildx build --platform linux/arm64 --load \
            -f /tmp/wrap/Containerfile.arm64 -t wrap-arm64:local /tmp/wrap

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          platforms: linux/arm64
          load: true
          tags: localhost/wrapvm:test
          build-args: BASE_IMAGE=wrap-arm64:local
          cache-from: type=gha,scope=wrapvm-arm64
          # mode=min: this image is ~7 GB, and the amd64 job already fills the
          # repository's GHA cache budget with mode=max.
          cache-to: type=gha,mode=min,scope=wrapvm-arm64

      # The same checks as `make test`, and as the amd64 job.
      - uses: ./.github/actions/test-image
